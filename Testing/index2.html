<script>
    const API_BASE_URL = 'https://instagranime-1.onrender.com';
    // const API_BASE_URL = 'http://127.0.0.1:5000'
    
    let currentUserId = null, players = {}, recommendationScores = {}, recommendationSignals = {}, seenAnimeIds = new Set(), isRefreshing = false, currentlyVisibleReel = null, progressCheckIntervals = {}, animeDetailsCache = {};
    let isApiReady = false, isFeedbackLocked = false;
    let apiReadyPromise = new Promise(resolve => { window.onYouTubeIframeAPIReady = () => { isApiReady = true; resolve(); }; });
    
    let setupScreen, reelsScreen, generateButton, reelContainer, exitButton, rankingPanelContainer, initialLoadingOverlay;
    let inputs = {};
    let intersectionObserver;
    let likeClickTracker = { animeId: null, count: 0, timer: null };
    let activeReelId = null;

    const statusLight = document.getElementById('api-status-light');
    async function checkApiStatus() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/status`);
            if (response.ok) {
                statusLight.classList.remove('red');
                statusLight.classList.add('green');
                statusLight.title = "API Status: Online";
                return true;
            } else {
                throw new Error('API not responding as expected.');
            }
        } catch (error) {
            console.error('API is offline:', error);
            statusLight.classList.remove('green');
            statusLight.classList.add('red');
            statusLight.title = "API Status: Offline. Attempting to reconnect...";
            setTimeout(checkApiStatus, 1000);
            return false;
        }
    }
    
    function showSuperLikeToast() {
        const toast = document.getElementById('super-like-toast');
        toast.style.opacity = '1';
        toast.style.top = '40px';
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.top = '20px';
        }, 2000);
    }

    function updateRankingPanel() {
        const rankingList = document.getElementById('ranking-list');
        const sortedAnime = Object.entries(recommendationScores).sort((a, b) => b[1] - a[1]);
        const signalToIcon = {
            'like_button': '<i data-lucide="heart" class="w-3 h-3 text-pink-400"></i>',
            'super_like_button': '<i data-lucide="sparkles" class="w-3 h-3 text-yellow-400"></i>',
            'save_to_watchlist': '<i data-lucide="bookmark" class="w-3 h-3 text-indigo-400"></i>',
            'watched_10_seconds': '<i data-lucide="play-circle" class="w-3 h-3 text-green-400"></i>',
            'scrolled_past': '<i data-lucide="skip-forward" class="w-3 h-3 text-gray-400"></i>'
        };
        rankingList.innerHTML = sortedAnime.map(([id, score], index) => {
            const title = animeDetailsCache[id] ? animeDetailsCache[id].title : 'Unknown';
            const signals = Array.from(recommendationSignals[id] || []);
            const signalIconsHTML = signals.map(sig => signalToIcon[sig] || '').join('');
            return `<div class="flex items-center justify-between mb-3 text-sm"><span class="font-bold text-indigo-400 mr-2">${index + 1}.</span><span class="flex-grow truncate text-gray-300">${title}</span><span class="flex items-center space-x-1 ml-2">${signalIconsHTML}</span><span class="font-medium text-gray-400 ml-2">${score.toFixed(2)}</span></div>`;
        }).join('');
        lucide.createIcons();
    }
    
    function reorderUpcomingReel() {
        if (!currentlyVisibleReel) return;
        const sortedAnime = Object.entries(recommendationScores).sort((a, b) => b[1] - a[1]);
        for (const [animeIdStr] of sortedAnime) {
            const animeId = parseInt(animeIdStr, 10);
            if (seenAnimeIds.has(animeId)) {
                continue;
            }
            const targetReel = reelContainer.querySelector(`[data-anime-id='${animeId}']`);
            if (targetReel && targetReel !== currentlyVisibleReel) {
                currentlyVisibleReel.after(targetReel);
                setupIntersectionObserver();
                break;
            }
        }
    }
    
    async function sendFeedbackSignal(animeId, reason, isAutomatic = false) {
        if (!currentUserId || (isFeedbackLocked && !isAutomatic)) return null;
        if (!isAutomatic) isFeedbackLocked = true;
        try {
            if (!recommendationSignals[animeId]) recommendationSignals[animeId] = new Set();
            const signalReason = (reason === 'super_like_button') ? 'like_button' : reason;
            if (recommendationSignals[animeId].has(signalReason) && !isAutomatic && reason !== 'save_to_watchlist') {
                recommendationSignals[animeId].delete(signalReason);
            } else {
                recommendationSignals[animeId].add(signalReason);
            }
            if (reason === 'super_like_button') recommendationSignals[animeId].add('super_like_button');
            updateRankingPanel();
            const feedbackResponse = await fetch(`${API_BASE_URL}/api/feedback`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, animeId: parseInt(animeId), reason })
            });
            if (!feedbackResponse.ok) return null;
            return await feedbackResponse.json();
        } catch (error) {
            console.error("Failed to process feedback:", error);
            return null;
        } finally {
            if (!isAutomatic) isFeedbackLocked = false;
        }
    }

    async function rescoreRemainingReels() {
       const animeIdsToRescore = Object.keys(animeDetailsCache);
       if (animeIdsToRescore.length > 0) {
            const rescoreResponse = await fetch(`${API_BASE_URL}/api/rescore`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, anime_ids: animeIdsToRescore })
            });
            if (rescoreResponse.ok) {
                const newScores = await rescoreResponse.json();
                Object.entries(newScores).forEach(([id, score]) => {
                    if (recommendationScores[id] !== undefined) recommendationScores[id] = score;
                });
                updateRankingPanel();
                reorderUpcomingReel();
            }
       }
    }

    function createPlayer(animeId, videoId, isPreloading = false) {
    return new YT.Player(`player-${animeId}`, {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
            'autoplay': isPreloading ? 0 : 1,
            'controls': 0,
            'showinfo': 0,
            'rel': 0,
            'loop': 1,
            'playlist': videoId,
            'mute': 0,
            'enablejsapi': 1
        },
        events: {
            'onReady': (event) => {
                console.log(`Player ${animeId} ready (preload: ${isPreloading})`);
                // First video will autoplay via playerVars
            },
            'onError': (event) => {
                console.error(`YouTube player error for ${animeId}:`, event.data);
            }
        }
    });
}

    async function refreshRecommendations() {
        if (isRefreshing) return;
        isRefreshing = true;
        
        const payload = {
            user_id: currentUserId,
            seen_anime_ids: Array.from(seenAnimeIds),
            allow_explicit: document.getElementById('explicit-toggle').checked,
            genres: inputs.genres.getTags()
        };
        try {
            const response = await fetch(`${API_BASE_URL}/api/generate_reel`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await response.json();
            if (data.recommendations && data.recommendations.length > 0) {
                appendReels(data.recommendations);
            }
        } catch (error) {
            console.error("Failed to refresh recommendations:", error);
        } finally {
            isRefreshing = false;
        }
    }

 async function onGenerateReel() {
    const username = inputs.username.value.trim();
    if (!username) { 
        alert("Please enter a username."); 
        return; 
    }
    
    const payload = {
        username,
        liked_anime: inputs.liked.getTags(),
        disliked_anime: inputs.disliked.getTags(),
        seen_anime_ids: [],
        allow_explicit: document.getElementById('explicit-toggle').checked,
        genres: inputs.genres.getTags()
    };
    
    toggleLoading(true);
    initialLoadingOverlay.classList.remove('hidden');

    try {
        // Add timeout to the fetch request
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
        
        const response = await fetch(`${API_BASE_URL}/api/generate_reel`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload),
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        currentUserId = data.user_id;
        
        setupScreen.classList.add('hidden');
        loadReels(data.recommendations);
        await preloadInitialReels(data.recommendations);
        
        reelsScreen.classList.remove('hidden');
        reelsScreen.classList.add('flex');
        rankingPanelContainer.classList.remove('hidden');
        
    } catch (error) {
        console.error('Failed to fetch recommendations:', error);
        
        if (error.name === 'AbortError') {
            alert('Request timed out. The server is taking too long to respond. Please try again.');
        } else {
            alert(`Error: ${error.message}`);
        }
        
        // Show retry button instead of automatically reloading
        showRetryOption();
    } finally {
        initialLoadingOverlay.classList.add('hidden'); 
        toggleLoading(false);
    }
}

// New function to show retry option instead of auto-reload
function showRetryOption() {
    const retryOverlay = document.createElement('div');
    retryOverlay.className = 'fixed inset-0 bg-gray-900/90 backdrop-blur-sm flex flex-col items-center justify-center z-50';
    retryOverlay.innerHTML = `
        <div class="bg-gray-800 rounded-2xl p-8 max-w-md text-center">
            <div class="text-red-400 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <h3 class="text-xl font-bold mb-2">Generation Failed</h3>
            <p class="text-gray-300 mb-6">The recommendation generation took too long or encountered an error.</p>
            <div class="flex space-x-4">
                <button id="retry-button" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                    Try Again
                </button>
                <button id="reload-button" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                    Start Over
                </button>
            </div>
        </div>
    `;
    
    document.body.appendChild(retryOverlay);
    
    document.getElementById('retry-button').addEventListener('click', () => {
        retryOverlay.remove();
        onGenerateReel();
    });
    
    document.getElementById('reload-button').addEventListener('click', () => {
        window.location.reload();
    });
}

// Also enhance the refreshRecommendations function with timeout
async function refreshRecommendations() {
    if (isRefreshing) return;
    isRefreshing = true;
    
    const payload = {
        user_id: currentUserId,
        seen_anime_ids: Array.from(seenAnimeIds),
        allow_explicit: document.getElementById('explicit-toggle').checked,
        genres: inputs.genres.getTags()
    };
    
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        
        const response = await fetch(`${API_BASE_URL}/api/generate_reel`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload),
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        const data = await response.json();
        if (data.recommendations && data.recommendations.length > 0) {
            appendReels(data.recommendations);
        }
    } catch (error) {
        console.error("Failed to refresh recommendations:", error);
        alert("Failed to get new recommendations. Please try again.");
    } finally {
        isRefreshing = false;
    }
}

    async function onExitSession() {
        if (currentUserId) {
            try { await fetch(`${API_BASE_URL}/api/user/${currentUserId}`, { method: 'DELETE' }); } catch (error) { console.error("Error deleting user:", error); }
        }
        window.location.reload();
    }

    function toggleLoading(isLoading) {
        generateButton.disabled = isLoading;
        document.getElementById('generate-button-text').classList.toggle('hidden', isLoading);
        document.getElementById('generate-button-spinner').classList.toggle('hidden', !isLoading);
    }
    
    // This is the fully updated function with suggestion logic built-in.
    function setupTagInput(inputId, containerId, bgColorClass, autocompleteId, apiEndpoint) {
        const input = document.getElementById(inputId);
        const container = document.getElementById(containerId);
        const autocompleteContainer = document.getElementById(autocompleteId);
        let tags = [];
        let debounceTimer;

        // --- NEW STATE MANAGEMENT FOR SUGGESTIONS ---
        const suggestionsContainer = document.getElementById('liked-suggestions-container');
        const suggestionsDiv = document.getElementById('liked-suggestions');
        let suggestionCache = []; // Holds the full list of 6 suggestions from the API
        let currentlyDisplayedSuggestions = []; // Holds the 3 suggestions visible on screen
        let suggestionDebounceTimer;
        let globallyDismissedSuggestions = new Set();
        // --- END NEW STATE ---

        async function fetchSuggestions() {
            if (tags.length === 0) {

    // This is the clean, corrected preload function
    async function preloadInitialReels(reels) {
    if (!isApiReady) await apiReadyPromise;
    
    // Only preload videos 2-5, not the first one
    const reelsToPreload = reels.slice(1, 5).filter(r => r.trailerId);
    
    const preloadPromises = reelsToPreload.map(anime => {
        return new Promise(resolve => {
            players[anime.id] = createPlayer(anime.id, anime.trailerId, true);
            setTimeout(resolve, 100); // Small delay to avoid overwhelming API
        });
    });
    
    await Promise.all(preloadPromises);
    
    // Force intersection check for first video
    setTimeout(() => {
        const firstReel = document.querySelector('.reel-item[data-anime-id]');
        if (firstReel && intersectionObserver) {
            intersectionObserver.unobserve(firstReel);
            intersectionObserver.observe(firstReel);
        }
    }, 1000);
}
    // This is the clean, corrected observer function
    function setupIntersectionObserver() {
    if (intersectionObserver) intersectionObserver.disconnect();

    const options = {
        root: reelContainer,
        threshold: 0.7, // 70% of the item must be visible
    };

    intersectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const animeId = entry.target.dataset.animeId;
            if (!animeId) return;

            // Get the player associated with this specific reel
            const player = players[animeId];

            if (entry.isIntersecting) {
                // --- This reel is NOW VISIBLE ---
                activeReelId = animeId;
                currentlyVisibleReel = entry.target;
                const animeIdInt = parseInt(activeReelId, 10);
                seenAnimeIds.add(animeIdInt);

                // Get the trailer ID and the current player instance
                const trailerId = animeDetailsCache[activeReelId]?.trailerId;
                let currentPlayer = players[activeReelId];

                // If the player doesn't exist yet, create it
                if (trailerId && !currentPlayer) {
                    currentPlayer = createPlayer(activeReelId, trailerId, false);
                    players[activeReelId] = currentPlayer;
                }
                
                // Play the video and start tracking its progress
                if (currentPlayer) {
                    playVideoWithRetry(currentPlayer, activeReelId);
                    startProgressCheck(activeReelId, currentPlayer);
                }

            } else {
                // --- This reel is NO LONGER VISIBLE ---
                // Directly pause the player for the reel that just left the screen
                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
                stopProgressCheck(animeId);
                
                // If the exiting reel was the active one, log a "scrolled_past" signal if no other action was taken
                if(activeReelId === animeId) {
                    const signals = recommendationSignals[animeId] || new Set();
                    if (signals.size === 0) {
                        const idInt = parseInt(animeId, 10);
                        sendFeedbackSignal(idInt, 'scrolled_past', true).then(() => rescoreRemainingReels());
                        seenAnimeIds.add(idInt);
                    }
                }
            }
        });
    }, options);

    // Observe all reel items that have an anime ID
    document.querySelectorAll('.reel-item[data-anime-id]').forEach(item => {
        intersectionObserver.observe(item);
    });
}

// New function to handle video playback with retry logic
function playVideoWithRetry(player, animeId, retryCount = 0) {
    if (retryCount >= 3) {
        console.warn(`Failed to play video for anime ${animeId} after ${retryCount} attempts`);
        return;
    }
    
    if (player && typeof player.playVideo === 'function') {
        try {
            const state = player.getPlayerState ? player.getPlayerState() : -1;
            if (state !== 1) { // If not already playing
                player.playVideo();
                
                // Verify playback started
                setTimeout(() => {
                    const newState = player.getPlayerState ? player.getPlayerState() : -1;
                    if (newState !== 1 && retryCount < 2) {
                        playVideoWithRetry(player, animeId, retryCount + 1);
                    }
                }, 500);
            }
        } catch (error) {
            console.error(`Error playing video for ${animeId}:`, error);
            if (retryCount < 2) {
                setTimeout(() => playVideoWithRetry(player, animeId, retryCount + 1), 300);
            }
        }
    }
}
    
    function startProgressCheck(animeId, player) {
        stopProgressCheck(animeId);
        progressCheckIntervals[animeId] = setInterval(() => {
            if (player && typeof player.getCurrentTime === 'function' && player.getPlayerState() === 1) {
                const currentTime = player.getCurrentTime();
                if (currentTime >= 10 && !recommendationSignals[animeId]?.has('watched_10_seconds')) {
                    const animeIdInt = parseInt(animeId, 10);
                    sendFeedbackSignal(animeIdInt, 'watched_10_seconds', true);
                    seenAnimeIds.add(animeIdInt); 
                }
            }
        }, 1000);
    }
    
    function stopProgressCheck(animeId) {
        if (progressCheckIntervals[animeId]) {
            clearInterval(progressCheckIntervals[animeId]);
            delete progressCheckIntervals[animeId];
        }
    }

        return;
    } else if (btn.classList.contains('save-btn')) {
        await handleAction(animeId, 'save_to_watchlist', reelItem, btn);
        return;
    } else if (btn.classList.contains('not-interested-btn')) {
        await handleAction(animeId, 'not_interested_button', reelItem, btn);
        return;
    }
});

reelContainer.addEventListener('mousedown', (e) => {
     if (e.target.closest('.action-btn') || e.target.closest('.show-details-btn')) return;
     if (e.clientX > reelContainer.offsetWidth / 2) {
         if (currentlyVisibleReel) {
             const activePlayer = players[currentlyVisibleReel.dataset.animeId];
             if (activePlayer && typeof activePlayer.setPlaybackRate === 'function') {
                 activePlayer.setPlaybackRate(2);
             }
         }
     }
});
document.addEventListener('mouseup', () => {
    if (currentlyVisibleReel) {
        const activePlayer = players[currentlyVisibleReel.dataset.animeId];
        if (activePlayer && typeof activePlayer.setPlaybackRate === 'function') {
            activePlayer.setPlaybackRate(1);
        }
    }
});
});

</script>
